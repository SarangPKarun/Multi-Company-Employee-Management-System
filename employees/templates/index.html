<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Management System - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .btn-custom {
            background-color: #39B5E0;
            color: white;
            font-weight: bold;
            padding: 10px 30px;
            border-radius: 25px;
        }

        .btn-custom:hover {
            background-color: #2d9ac0;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container text-center">
        <h1 class="mb-5 display-4 fw-bold text-primary" style="color: #39B5E0 !important;">Multi-Company Employee
            Management</h1>
        <div class="row justify-content-center">

            <div class="col-md-5 mb-4">
                <div class="card p-4">
                    <div class="card-body">
                        <h3 class="card-title mb-3">Admin Portal</h3>
                        <p class="card-text text-muted mb-4">Manage users, permissions, and system configurations.</p>
                        <a href="/admin/" class="btn btn-custom">Go to Admin</a>
                    </div>
                </div>
            </div>

            <div class="col-md-5 mb-4">
                <div class="card p-4">
                    <div class="card-body">
                        <h3 class="card-title mb-3">Employee System</h3>
                        <p class="card-text text-muted mb-4">View, add, update, and manage employee records.</p>
                        <a href="/emp/home/" class="btn btn-custom">Go to Employees</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
        crossorigin="anonymous"></script>
</body>

</html>
